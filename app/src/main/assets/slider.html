<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CarX Street 雪花大小控制器</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0e1118;color:#eef3ff;min-height:100vh;display:grid;place-items:center;padding:18px}.panel{width:min(420px,100%);background:#171d29;border:1px solid #2c374b;border-radius:22px;padding:20px;box-shadow:0 18px 55px #0007}.top{display:flex;align-items:center;justify-content:space-between}.dot{width:9px;height:9px;border-radius:50%;background:#f0b95b;display:inline-block;margin-right:7px}.sub{color:#9ba9c2;font-size:12px}.title{font-size:18px;font-weight:750}.value{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:22px 0 6px}.unit{font-size:13px;color:#a9b5cb;font-weight:500}.range{width:100%;accent-color:#8ab4ff;height:32px;margin:14px 0}.ends{display:flex;justify-content:space-between;color:#9ba9c2;font-size:12px}.row{display:flex;gap:8px;margin-top:16px}.btn{border:1px solid #35425a;background:#222c3e;color:#eef3ff;border-radius:12px;padding:11px 12px;font-size:14px;flex:1}.btn.primary{background:#d5e4ff;color:#152238;border-color:#d5e4ff;font-weight:700}.hint{font-size:12px;line-height:1.6;color:#a9b5cb;margin-top:18px;border-top:1px solid #2c374b;padding-top:14px}.num{width:90px;background:#0e1118;color:#eef3ff;border:1px solid #35425a;border-radius:10px;padding:8px;font-size:16px;text-align:center}
</style></head><body><main class="panel"><div class="top"><div><div class="title">❄ 雪花大小控制器</div><div class="sub" style="margin-top:6px">CarX Street · 1.23 · 配置控制端</div></div><div class="sub"><span class="dot"></span>等待原生模块</div></div><div class="value"><span id="v">1.00</span><span class="unit">× 尺寸倍率</span></div><input id="slider" class="range" type="range" min="0.25" max="3" step="0.01" value="1"><div class="ends"><span>0.25× 细小</span><span>3.00× 较大</span></div><div class="row"><button class="btn" id="minus">− 0.01</button><input id="num" class="num" type="number" min="0.25" max="3" step="0.01" value="1.00" aria-label="倍率数值"><button class="btn" id="plus">+ 0.01</button></div><div class="row"><button class="btn" id="reset">恢复默认</button><button class="btn primary" id="copy">复制配置</button></div><div class="hint">滑块会把 0.25×–3.00× 倍率写入 root 配置文件。只有配套原生注入模块在游戏进程中成功运行后，实际雪花大小才会改变；单独运行此界面不会修改游戏画面。</div></main><script>
const s=document.querySelector('#slider'),v=document.querySelector('#v'),n=document.querySelector('#num');function set(x){x=Math.max(.25,Math.min(3,Number(x)||1));x=Math.round(x*100)/100;s.value=x;n.value=x.toFixed(2);v.textContent=x.toFixed(2);try{if(window.CarXSnowBridge)window.CarXSnowBridge.setMultiplier(x.toFixed(2))}catch(e){}}s.addEventListener('input',()=>set(s.value));n.addEventListener('change',()=>set(n.value));document.querySelector('#minus').onclick=()=>set(Number(s.value)-.01);document.querySelector('#plus').onclick=()=>set(Number(s.value)+.01);document.querySelector('#reset').onclick=()=>set(1);document.querySelector('#copy').onclick=async()=>{let x=Number(s.value).toFixed(2);let t=`# CarX Street snow size UI prototype\nsize_multiplier=${x}\n`;try{await navigator.clipboard.writeText(t);document.querySelector('#copy').textContent='已复制';setTimeout(()=>document.querySelector('#copy').textContent='复制配置',1200)}catch(e){prompt('复制以下配置',t)}};set(1);
</script></body></html>
