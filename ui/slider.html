<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CarX Street 雪花大小控制器</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;--ink:#202735;--muted:#7b8493;--line:#e6eaf0;--blue:#3478f6;--blue-soft:#eaf1ff;--surface:#fff}*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:var(--ink);padding:10px;overflow:hidden}.panel{width:100%;background:var(--surface);border:1px solid #e8ebf1;border-radius:20px;padding:17px;box-shadow:0 8px 26px #18243a12;animation:enter .28s cubic-bezier(.2,.8,.2,1) both}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.title{font-size:17px;font-weight:780;letter-spacing:-.25px}.sub{color:var(--muted);font-size:11px}.status{display:flex;align-items:center;gap:6px;white-space:nowrap;background:#f3f5f8;border-radius:99px;padding:6px 9px}.dot{width:7px;height:7px;border-radius:50%;background:#e9ad42;display:inline-block;flex:none}.value{font-size:34px;font-weight:820;letter-spacing:-1.3px;font-variant-numeric:tabular-nums;margin:19px 0 2px;transition:transform .16s ease}.unit{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}.range{width:100%;accent-color:var(--blue);height:30px;margin:11px 0 7px;cursor:pointer}.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.row{display:flex;gap:8px;margin-top:13px;align-items:center}.btn{border:1px solid var(--line);background:#f7f8fa;color:var(--ink);border-radius:12px;padding:11px 9px;font-size:13px;font-weight:650;flex:1;min-width:0;transition:background .16s ease,transform .16s ease,border-color .16s ease}.btn:active{transform:scale(.97);background:#edf1f7}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:750;box-shadow:0 4px 10px #3478f626}.btn.primary:active{background:#2867dc}.num{width:82px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:11px;padding:10px 4px;font-size:16px;font-weight:750;text-align:center;outline:none}.num:focus{border-color:#9bbaff;box-shadow:0 0 0 3px #3478f61a}.hint{font-size:10px;line-height:1.55;color:#858e9d;margin-top:14px;border-top:1px solid var(--line);padding-top:11px}.toast{opacity:0;transform:translateY(4px);transition:all .18s ease;font-size:11px;color:#26714d;background:#e9f8ef;padding:7px 10px;border-radius:9px;margin-top:8px;height:0;padding-top:0;padding-bottom:0;overflow:hidden}.toast.show{opacity:1;transform:translateY(0);height:auto;padding:7px 10px}@keyframes enter{from{opacity:0;transform:translateY(7px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main class="panel"><div class="top"><div><div class="title">❄ 雪花大小控制器</div><div class="sub" style="margin-top:5px">CarX Street · 1.23 · 悬浮控制</div></div><div class="status"><span class="dot"></span><span class="sub" id="statusText">等待原生模块</span></div></div><div class="value"><span id="v">1.00</span><span class="unit"> × 尺寸倍率</span></div><input id="slider" class="range" type="range" min="0.25" max="10" step="0.01" value="1" aria-label="雪花尺寸倍率"><div class="ends"><span>0.25× 细小</span><span>10.00× 超大</span></div><div class="row"><button class="btn" id="minus" aria-label="减小倍率">− 0.01</button><input id="num" class="num" type="number" min="0.25" max="3" step="0.01" value="1.00" aria-label="倍率数值"><button class="btn" id="plus" aria-label="增加倍率">+ 0.01</button></div><div class="row"><button class="btn" id="reset">恢复默认</button><button class="btn primary" id="copy">复制配置</button></div><div id="toast" class="toast" role="status"></div><div class="hint">可拖动上方标题栏移动悬浮窗，点击右上角「缩小」可收起为小条，游戏时减少遮挡。当前倍率会写入配置文件；游戏内效果仍取决于原生模块是否成功连接。</div></main><script>
const s=document.querySelector('#slider'),v=document.querySelector('#v'),n=document.querySelector('#num'),toast=document.querySelector('#toast');let toastTimer;function say(t){toast.textContent=t;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1600)}function set(x){x=Math.max(.25,Math.min(10,Number(x)||1));x=Math.round(x*100)/100;s.value=x;n.value=x.toFixed(2);v.textContent=x.toFixed(2);v.animate([{transform:'scale(1.035)'},{transform:'scale(1)'}],{duration:150,easing:'ease-out'});try{if(window.CarXSnowBridge)window.CarXSnowBridge.setMultiplier(x.toFixed(2))}catch(e){say('配置写入失败，请检查 Root 授权')}}s.addEventListener('input',()=>set(s.value));n.addEventListener('change',()=>set(n.value));document.querySelector('#minus').onclick=()=>set(Number(s.value)-.01);document.querySelector('#plus').onclick=()=>set(Number(s.value)+.01);document.querySelector('#reset').onclick=()=>{set(1);
function refreshStatus(){try{if(window.CarXSnowBridge){const t=window.CarXSnowBridge.getStatus();document.querySelector('#statusText').textContent=t;}}catch(e){document.querySelector('#statusText').textContent='读取模块状态失败';}}setInterval(refreshStatus,1500);refreshStatus();say('已恢复默认倍率')};document.querySelector('#copy').onclick=async()=>{let x=Number(s.value).toFixed(2),t=`# CarX Street snow size\nsize_multiplier=${x}\n`;try{await navigator.clipboard.writeText(t);say('配置已复制')}catch(e){prompt('复制以下配置',t)}};set(1);
</script></body></html>
