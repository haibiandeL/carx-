<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CarX Street 雪花大小控制器</title>
<style>
:root{color-scheme:light;font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;--ink:#202124;--muted:#6b7280;--line:#e5e7eb;--soft:#f7f8fa;--blue:#2563eb}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eef2f7;color:var(--ink);min-height:100%;width:100%;overflow-x:hidden}body{font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif}.panel{display:block;width:100%;min-height:100vh;background:linear-gradient(180deg,#ffffff 0%,#fbfcff 100%);border:1px solid rgba(226,232,240,.95);border-radius:24px;padding:18px 16px 20px;box-shadow:0 8px 28px rgba(15,23,42,.10);outline:0;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{font-size:18px;font-weight:750}.sub{color:var(--muted);font-size:12px}.status{white-space:nowrap}.dot{width:8px;height:8px;border-radius:50%;background:#d97706;display:inline-block;margin-right:6px}.section{margin-top:12px;font-weight:700;font-size:14px}.weatherToggle{margin-top:9px;width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:12px 13px;background:#fff;border:1px solid #d1d5db;border-radius:16px;color:var(--ink);font-size:15px}.arrow{transition:transform .15s}.weatherToggle[aria-expanded="true"] .arrow{transform:rotate(180deg)}.weatherMenu{display:none;margin-top:7px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.weatherMenu.open{display:block}.weatherOption{display:block;width:100%;padding:12px 13px;text-align:left;border:0;border-bottom:1px solid #f0f1f3;background:#fff;color:var(--ink);font-size:14px}.weatherOption:last-child{border-bottom:0}.weatherOption:active,.weatherOption.selected{background:#eff6ff;color:#1d4ed8}.btn:active,.weatherToggle:active{transform:scale(.985)}button,input{ -webkit-tap-highlight-color:transparent }button{transition:background .16s ease,border-color .16s ease,transform .12s ease}.value{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:14px 0 4px}.unit{font-size:13px;color:var(--muted);font-weight:500}.range{width:100%;accent-color:var(--blue);height:32px;margin:12px 0}.ends{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.row{display:flex;gap:8px;margin-top:13px}.btn{border:1px solid #d1d5db;background:#fff;color:var(--ink);border-radius:16px;padding:11px 12px;font-size:14px;flex:1}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}.num{width:94px;background:#fff;color:var(--ink);border:1px solid #d1d5db;border-radius:14px;padding:9px;font-size:16px;text-align:center}.hint{font-size:12px;line-height:1.6;color:var(--muted);margin-top:10px;border-top:1px solid var(--line);padding-top:12px}.state{margin-top:7px;line-height:1.5;min-height:18px}#toast{display:none;margin-top:8px;color:#166534;font-size:12px}#toast.show{display:block}
</style></head><body><main class="panel"><div class="top"><div><div class="title">❄ 雪花大小控制器</div><div class="sub" style="margin-top:5px">CarX Street · 1.23 · 配置控制端</div></div><div class="sub status"><span class="dot"></span>安全诊断模式</div></div>
<div class="section">天气预设</div><button type="button" id="weatherToggle" class="weatherToggle" aria-expanded="false"><span id="weatherLabel">Generic（通用）</span><span class="arrow">⌄</span></button><div id="weatherMenu" class="weatherMenu" role="group" aria-label="选择天气预设"><button type="button" class="weatherOption selected" data-weather="0">Generic（通用）</button><button type="button" class="weatherOption" data-weather="1">Halloween（万圣节）</button><button type="button" class="weatherOption" data-weather="2">Winter（雪天）</button></div><div class="sub state" id="weatherState">选择后将调用游戏内 SetPresetType；结果以原生状态为准</div>
<div class="value"><span id="v">1.00</span><span class="unit">× 尺寸倍率</span></div><input id="slider" class="range" type="range" min="0.25" max="10" step="0.01" value="1" aria-label="雪花尺寸倍率"><div class="ends"><span>0.25× 细小</span><span>10.00× 较大</span></div><div class="row"><button class="btn" id="minus" type="button">− 0.01</button><input id="num" class="num" type="number" min="0.25" max="10" step="0.01" value="1.00" aria-label="倍率数值"><button class="btn" id="plus" type="button">+ 0.01</button></div><div class="row"><button class="btn" id="reset" type="button">恢复默认</button><button class="btn primary" id="copy" type="button">复制配置</button></div><div id="toast"></div><div class="hint">本界面将倍率写入 Root 配置文件，并将天气选项写入枚举值（Generic=0、Halloween=1、Winter=2）。游戏内生效取决于 Zygisk 原生控制模块是否成功连接；天气调用仍需在目标版本实机验证。</div></main>
<script>
const s=document.querySelector('#slider'),v=document.querySelector('#v'),n=document.querySelector('#num'),toast=document.querySelector('#toast');let selectedWeather='0';
function say(t){toast.textContent=t;toast.classList.add('show');}
function set(x){x=Number(x);if(!Number.isFinite(x))x=1;x=Math.max(.25,Math.min(10,x));x=Math.round(x*100)/100;s.value=String(x);n.value=x.toFixed(2);v.textContent=x.toFixed(2);try{if(window.CarXSnowBridge)window.CarXSnowBridge.setMultiplier(x.toFixed(2));}catch(e){say('倍率配置写入失败：检查 Root 授权');}}
const toggle=document.querySelector('#weatherToggle'),menu=document.querySelector('#weatherMenu'),label=document.querySelector('#weatherLabel'),weatherState=document.querySelector('#weatherState');
toggle.addEventListener('click',()=>{const open=menu.classList.toggle('open');toggle.setAttribute('aria-expanded',String(open));});
document.querySelectorAll('.weatherOption').forEach(btn=>btn.addEventListener('click',()=>{selectedWeather=btn.dataset.weather;label.textContent=btn.textContent;document.querySelectorAll('.weatherOption').forEach(x=>x.classList.toggle('selected',x===btn));menu.classList.remove('open');toggle.setAttribute('aria-expanded','false');try{if(window.CarXSnowBridge){window.CarXSnowBridge.setWeather(selectedWeather);weatherState.textContent='已请求调用：'+btn.textContent+'；请观察游戏效果';}else{weatherState.textContent='当前未连接 Root 桥接，未写入配置';}}catch(e){weatherState.textContent='天气配置写入失败：检查 Root 授权';}}));
s.addEventListener('input',()=>set(s.value));n.addEventListener('change',()=>set(n.value));document.querySelector('#minus').addEventListener('click',()=>set(Number(s.value)-.01));document.querySelector('#plus').addEventListener('click',()=>set(Number(s.value)+.01));document.querySelector('#reset').addEventListener('click',()=>{set(1);say('倍率已恢复为 1.00×');});document.querySelector('#copy').addEventListener('click',async()=>{const x=Number(s.value).toFixed(2),t=`# CarX Street configuration\nsize_multiplier=${x}\nweather_preset=${selectedWeather}\n`;try{await navigator.clipboard.writeText(t);say('配置已复制');}catch(e){prompt('复制以下配置',t);}});set(1);
</script></body></html>
